databases:
  - name: eroma-db
    databaseName: eroma
    user: eroma
    plan: free
    region: singapore

services:
  - type: web
    name: eroma-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/products/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: eroma-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: eroma-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://eroma-store.onrender.com
      - key: FRONTEND_URL
        value: https://eroma-store.onrender.com
      - key: GEMINI_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false

  - type: web
    name: eroma-store
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://eroma-api.onrender.com/api
      - key: VITE_WHATSAPP_NUMBER
        value: "918838816692"
